  NOTE: This .html file (and public folder) is optional and can be safely deleted.
  It serves only as a demo/test page.
  
  The chatbot can be embedded directly on any allowed domain using the embed script that
  is generated when starting the server.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowise Chatbot Widget</title>
</head>

<body>
    <div id="root"></div>
    <script type="module">
        import Chatbot from './web.js'
        
        Chatbot.init({
            chatflowid: "25a88c38-ef99-4cd1-8889-8aed8592b2ca",
            apiHost: "https://ehlchatbot.ehl.edu",
            chatflowConfig: {
                            vars: {
                                "today_date": new Date().toLocaleDateString('en-GB', {
                                    weekday: 'long',
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric'
                                })
                            }
                        },
            observersConfig: {
                /* Observers Config */
            },
            theme: {
                customCSS: "* { font-family: 'Open Sans', sans-serif; } \
                [part='button'] { background-color: #FFFFFF !important; padding: 0px !important; width: 60px !important; height: 60px !important;} \
                [part='bot'] { border-radius: 15px !important; overflow: hidden } \
                [part='host-bubble'] , .chatbot-host-bubble { border-radius: 15px !important; overflow: hidden !important; } \
                [part='user-message'], .chatbot-guest-bubble { border-radius: 15px !important; overflow: hidden !important; }", 
                button: {
                    backgroundColor: '#F1F1EF',
                    right: 10,
                    bottom: 60,
                    size: 85,
                    dragAndDrop: false,
                    iconColor: '#000E24',
                    customIconSrc: 'images/chat_bubble.png',
                    autoWindowOpen: {
                        autoOpen: false,
                        openDelay: 2,
                        autoOpenOnMobile: false
                    },
                },
                tooltip: {
                    showTooltip: false,
                    tooltipMessage: 'A question about EHL? I can help!',
                    tooltipBackgroundColor: '#000E24',
                    tooltipTextColor: 'white',
                    tooltipFontSize: 16
                },
                disclaimer: {
                    title: 'Disclaimer',
                    message: "Before we start, please note that by continuing this chat, you agree to our <a target=\"_blank\" href=\"https://www.ehlgroup.com/en/privacy\">Privacy Policy</a>. Do you agree?",
                    textColor: 'black',
                    buttonColor: '#000E24',
                    buttonText: 'Yes, I agree',
                    denyButtonText: 'No, I don\'t',
                    buttonTextColor: 'white',
                    denyButtonBgColor: '#FFFFFF',
                    blurredBackgroundColor: 'rgba(0, 0, 0, 0.2)',
                    backgroundColor: '#F1F1EF'
                },
                chatWindow: {
                    showTitle: true,
                    showAgentMessages: true,
                    title: 'EHL Digital Assistant',
                    titleAvatarSrc: 'images/chat_bubble.png',
                    welcomeMessage: 'Hey! I\'m EHL\'s Digital Assistant. How can I help you today?',
                    errorMessage: 'There seems to be an error. Please try again later.',
                    backgroundColor: '#ffffff',
                    width: 500,
                    fontSize: 16,
                    starterPrompts: [
                        "How do I apply to EHL?",
                        "What do we learn at EHL?",
                    ],
                    starterPromptFontSize: 12,
                    clearChatOnReload: false,
                    sourceDocsTitle: 'Sources:',
                    renderHTML: true,
                    botMessage: {
                        backgroundColor: '#000E24',
                        textColor: '#F1F1EF',
                        showAvatar: true,
                        avatarSrc: 'images/EHL_bubble.webp'
                    },
                    userMessage: {
                        backgroundColor: '#F1F1EF',
                        textColor: '#000F29',
                        showAvatar: false,
                    },
                    textInput: {
                        placeholder: 'Type your question here',
                        backgroundColor: '#ffffff',
                        textColor: '#303235',
                        sendButtonColor: '#000F29',
                        maxChars: 200,
                        maxCharsWarningMessage: 'You exceeded the characters limit. Please input less than 200 characters.',
                        autoFocus: true,
                        sendMessageSound: true,
                        sendSoundLocation: 'send_message.mp3',
                        receiveMessageSound: true,
                        receiveSoundLocation: 'receive_message.mp3'
                    },
                    feedback: {
                        color: '#000F29',
                        backgroundColor: '#F1F1EF',
                        textColor: '#000F29', 
                        inputColor: '#000F29',
                        buttonColor: '#000F29',

                    },
                    dateTimeToggle: {
                        date: true,
                        time: true
                    },
                    footer: {
                        textColor: '#919388',
                        fontSize: 4,
                        text: 'Powered by [Novatix](https://www.novatix.ch)',
                        company: 'EHL\'s Privacy Policy',
                        companyLink: 'https://www.ehlgroup.com/en/privacy',
                        companyTextColor: '#000F29'
                    }
                }
            }
        })
    </script>
</body>

</html>
