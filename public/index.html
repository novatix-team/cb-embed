<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowise Chatbot Widget</title>
</head>

<body>
    <h1>EHL Digital Assistant</h1>
    <p>This is a page to test the chatbot</p>
</body>

<body>
    <div id="root"></div>
    <script type="module">
        import Chatbot from './web.js'
        
        // Auto-detect language from URL
        function detectLanguageFromURL() {
            const path = window.location.pathname.toLowerCase();
            const segments = path.split('/').filter(segment => segment.length > 0);
            
            // Check if the first path segment is a language code
            if (segments.length > 0) {
                const firstSegment = segments[0];
                if (firstSegment === 'fr') return 'fr';
                if (firstSegment === 'de') return 'de';
                if (firstSegment === 'en') return 'en';
            }
            return 'en'; // Default to English if no language indicator found
        }
        
        const detectedLanguage = detectLanguageFromURL();
        const privacyPolicyURL = `https://www.ehlgroup.com/${detectedLanguage}/privacy`;
        
        // Define starter prompts based on detected language
        let starterPrompts;
        if (detectedLanguage === 'de') {
            starterPrompts = [
                "Wie kann ich mich für EHL bewerben?",
                "Was lernen wir an der EHL?",
            ];
        } else if (detectedLanguage === 'fr') {
            starterPrompts = [
                "Comment puis-je postuler à EHL?",
                "Qu'apprenons-nous à EHL?",
            ];
        } else { // Default to English
            starterPrompts = [
                "How do I apply to EHL?",
                "What do we learn at EHL?",
            ];
        }
        
        Chatbot.init({
            chatflowid: "25a88c38-ef99-4cd1-8889-8aed8592b2ca",
            apiHost: "https://ehlchatbot.ehl.edu",
            chatflowConfig: {
                            vars: {
                                "today_date": new Date().toLocaleDateString('en-GB', {
                                    weekday: 'long',
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric'
                                })
                            }
                        },
            observersConfig: {
                /* Observers Config */
            },
            theme: {
                language: detectedLanguage, // Auto-detected from URL (/en, /fr, /de)
                customCSS: "* { font-family: 'Open Sans', sans-serif; } \
                [part='button'] { background-color: #FFFFFF !important; padding: 0px !important; width: 60px !important; height: 60px !important;} \
                [part='bot'] { border-radius: 15px !important; overflow: hidden } \
                [part='host-bubble'] , .chatbot-host-bubble { border-radius: 15px !important; overflow: hidden !important; } \
                [part='user-message'], .chatbot-guest-bubble { border-radius: 15px !important; overflow: hidden !important; }", 
                button: {
                    backgroundColor: '#F1F1EF',
                    right: 10,
                    mobileBottom: 60,   // Mobile positioning (avoids scroll arrow)
                    desktopBottom: 20,  // Desktop positioning (symmetric corner)
                    size: 85,
                    dragAndDrop: false,
                    iconColor: '#000E24',
                    customIconSrc: 'images/chat_bubble.png',
                    autoWindowOpen: {
                        autoOpen: false,
                        openDelay: 2,
                        autoOpenOnMobile: false
                    },
                },
                // Language is auto-detected from URL (/en, /fr, /de) or set manually below
                // Leave all message fields undefined to use auto-translated text
                tooltip: {
                    showTooltip: false,
                    // tooltipMessage: 'A question about EHL? I can help!',
                    tooltipBackgroundColor: '#000E24',
                    tooltipTextColor: 'white',
                    tooltipFontSize: 16
                },
                disclaimer: {
                    // title: Auto-translated based on detected language
                    // message: Auto-translated based on detected language  
                    // buttonText: Auto-translated based on detected language
                    // denyButtonText: Auto-translated based on detected language
                    textColor: 'black',
                    buttonColor: '#000E24',
                    buttonTextColor: 'white',
                    denyButtonBgColor: '#FFFFFF',
                    blurredBackgroundColor: 'rgba(0, 0, 0, 0.2)',
                    backgroundColor: '#F1F1EF'
                },
                chatWindow: {
                    showTitle: true,
                    showAgentMessages: true,
                    title: 'EHL Digital Assistant',
                    titleAvatarSrc: 'images/chat_bubble.png',
                    welcomeMessage: 'Hey! I\'m EHL\'s Digital Assistant. How can I help you today?',
                    errorMessage: 'There seems to be an error. Please try again later.',
                    backgroundColor: '#ffffff',
                    width: 500,
                    fontSize: 16,
                    starterPrompts: starterPrompts,
                    starterPromptFontSize: 12,
                    clearChatOnReload: false,
                    sourceDocsTitle: 'Sources:',
                    renderHTML: true,
                    botMessage: {
                        backgroundColor: '#000E24',
                        textColor: '#F1F1EF',
                        showAvatar: true,
                        avatarSrc: 'images/EHL_bubble.webp'
                    },
                    userMessage: {
                        backgroundColor: '#F1F1EF',
                        textColor: '#000F29',
                        showAvatar: false,
                    },
                    textInput: {
                        // placeholder: Commented out to use auto-translation
                        backgroundColor: '#ffffff',
                        textColor: '#303235',
                        sendButtonColor: '#000F29',
                        maxChars: 1500,
                        maxCharsWarningMessage: 'You exceeded the characters limit. Please input less than 1500 characters.',
                        autoFocus: true
                        // sendMessageSound: true,
                        // sendSoundLocation: 'send_message.mp3',
                        // receiveMessageSound: true,
                        // receiveSoundLocation: 'receive_message.mp3'
                    },
                    feedback: {
                        color: '#000F29',
                        backgroundColor: '#FFFFFF',
                        textColor: '#000F29', 
                        inputColor: '#000F29',
                        buttonColor: '#000F29',

                    },
                    dateTimeToggle: {
                        date: true,
                        time: true
                    },
                    footer: {
                        textColor: '#919388',
                        fontSize: 4,
                        text: 'Powered by [Novatix](https://www.novatix.ch)',
                        company: 'EHL\'s Privacy Policy',
                        companyLink: privacyPolicyURL, // Auto-constructed based on detected language
                        companyTextColor: '#000F29'
                    }
                }
            }
        })
    </script>
</body>

</html>
